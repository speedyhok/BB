<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Albuquerque 3D - Breaking Bad City</title>
  <script src="js/three.min.js"></script>
  <script src="js/GLTFLoader.js"></script>
  <script src="js/OrbitControls.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@600;700&family=Inter:wght@400;500;600;700;800;900&display=swap');
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080a0f;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #fff;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      left: 0;
      top: 0;
      z-index: 1;
    }

    /* TOP BAR - CLEAN & MINIMAL */
    #top-nav {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 6px 10px 6px 14px;
      background: rgba(12, 16, 24, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(0, 0, 0, 0.4);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-right: 6px;
      border-right: 1px solid rgba(255, 255, 255, 0.12);
    }

    .element-pill {
      display: inline-flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 28px;
      height: 28px;
      background: #0d4a2d;
      border: 1.5px solid #10b981;
      border-radius: 4px;
      color: #fff;
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
    }

    .brand-title {
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #f3f4f6;
    }

    /* THE TWO OPTIONS BUTTONS */
    .mode-switch {
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 9999px;
      padding: 3px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .mode-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 20px;
      border: none;
      border-radius: 9999px;
      background: transparent;
      color: #9ca3af;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .mode-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.06);
    }

    .mode-btn.active {
      color: #042f1a;
      background: #10b981;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.45);
    }

    .mode-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    /* TOP VIEW 3D LANDMARK PINS */
    #markers-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
      overflow: hidden;
    }

    .landmark-pin {
      position: absolute;
      pointer-events: auto;
      transform: translate(-50%, -100%);
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 11px;
      background: rgba(14, 18, 28, 0.92);
      border: 1px solid rgba(16, 185, 129, 0.6);
      border-radius: 9999px;
      color: #ecfdf5;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 12px rgba(16, 185, 129, 0.3);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .landmark-pin:hover {
      background: #10b981;
      color: #042f1a;
      transform: translate(-50%, -108%) scale(1.1);
      box-shadow: 0 12px 28px rgba(16, 185, 129, 0.5);
    }

    .landmark-pin .pin-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
    }

    .landmark-pin:hover .pin-dot {
      background: #042f1a;
    }

    /* GROUND EXPLORATION LOCATION BAR */
    #ground-bar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: none;
      align-items: center;
      gap: 8px;
      max-width: 95vw;
      overflow-x: auto;
      padding: 8px 14px;
      background: rgba(12, 16, 24, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
      scrollbar-width: none;
    }

    #ground-bar::-webkit-scrollbar {
      display: none;
    }

    .ground-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 9999px;
      color: #d1d5db;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .ground-btn:hover {
      background: rgba(16, 185, 129, 0.15);
      border-color: #10b981;
      color: #fff;
    }

    .ground-btn.active {
      background: #10b981;
      border-color: #10b981;
      color: #042f1a;
      font-weight: 700;
    }

    /* CONTROLS HINT PILL */
    #controls-hint {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      padding: 5px 14px;
      background: rgba(15, 20, 30, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      color: #9ca3af;
      font-size: 11px;
      font-weight: 500;
      pointer-events: none;
      letter-spacing: 0.02em;
      transition: opacity 0.3s ease;
    }

    /* ONSCREEN D-PAD FOR TOUCH / MOUSE WALK */
    #dpad {
      position: absolute;
      bottom: 24px;
      left: 24px;
      z-index: 20;
      display: none;
      grid-template-columns: repeat(3, 44px);
      grid-template-rows: repeat(3, 44px);
      gap: 5px;
    }

    .dpad-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(18, 24, 38, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      color: #fff;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.1s ease;
    }

    .dpad-btn:active {
      background: #10b981;
      color: #000;
      transform: scale(0.94);
    }

    /* LOADING SCREEN */
    #loader {
      position: absolute;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090c12;
      transition: opacity 0.6s ease;
    }

    .loader-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      max-width: 320px;
      text-align: center;
    }

    .loader-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #fff;
    }

    .progress-bar-bg {
      width: 240px;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 9999px;
      overflow: hidden;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: #10b981;
      border-radius: 9999px;
      transition: width 0.15s ease;
    }

    .loader-status {
      font-family: 'Fira Code', monospace;
      font-size: 12px;
      color: #9ca3af;
    }

    @media (max-width: 640px) {
      #top-nav {
        top: 10px;
        padding: 5px 8px;
        gap: 8px;
      }
      .brand-title {
        display: none;
      }
      .brand {
        padding-right: 2px;
      }
      .mode-btn {
        padding: 7px 14px;
        font-size: 12px;
      }
      #ground-bar {
        bottom: 12px;
        padding: 6px 10px;
      }
    }
  </style>
</head>
<body>

  <!-- 3D Canvas -->
  <div id="canvas-container"></div>

  <!-- Loading Screen -->
  <div id="loader">
    <div class="loader-box">
      <div style="display: flex; gap: 6px;">
        <div class="element-pill" style="width: 36px; height: 36px; font-size: 14px;">Br</div>
        <div class="element-pill" style="width: 36px; height: 36px; font-size: 14px;">Ba</div>
      </div>
      <div class="loader-title">ALBUQUERQUE 3D</div>
      <div class="progress-bar-bg">
        <div id="progress-fill" class="progress-bar-fill"></div>
      </div>
      <div id="loader-status" class="loader-status">Loading City 0%</div>
    </div>
  </div>

  <!-- Top Bar: The ONLY Two Options -->
  <nav id="top-nav">
    <div class="brand">
      <div class="element-pill">Br</div>
      <span class="brand-title">Albuquerque 3D</span>
    </div>
    <div class="mode-switch">
      <button id="btn-top" class="mode-btn active" onclick="switchMode('top')">
        <svg viewBox="0 0 24 24"><path d="M12 2L1 21h22L12 2zm0 4.5l6.5 11.5H5.5L12 6.5z"/></svg>
        <span>Top View</span>
      </button>
      <button id="btn-ground" class="mode-btn" onclick="switchMode('ground')">
        <svg viewBox="0 0 24 24"><path d="M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9L7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3C14.8 12 16.8 13 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7z"/></svg>
        <span>Explore from Ground</span>
      </button>
    </div>
  </nav>

  <!-- Controls Hint -->
  <div id="controls-hint">Drag: Rotate • Right-Click: Pan • Scroll: Zoom • Click Pin: Drop to Ground</div>

  <!-- Top View 3D Landmark Pins -->
  <div id="markers-container"></div>

  <!-- Ground Exploration Location Quick-Jump Bar -->
  <div id="ground-bar">
    <button class="ground-btn" onclick="teleportGround('walt')">🏡 Walt's House</button>
    <button class="ground-btn" onclick="teleportGround('pollos')">🍗 Pollos Hermanos</button>
    <button class="ground-btn" onclick="teleportGround('saul')">⚖️ Saul Goodman</button>
    <button class="ground-btn" onclick="teleportGround('superlab')">🧺 Superlab</button>
    <button class="ground-btn" onclick="teleportGround('carwash')">🧼 A1A Carwash</button>
    <button class="ground-btn" onclick="teleportGround('desert')">🚐 Desert RV</button>
    <button class="ground-btn" onclick="teleportGround('hank')">💎 Hank's House</button>
    <button class="ground-btn" onclick="teleportGround('jesse')">🏡 Jesse's House</button>
    <button class="ground-btn" onclick="teleportGround('downtown')">🏙️ Downtown</button>
  </div>

  <!-- D-Pad for Touch / Mobile Walk -->
  <div id="dpad">
    <div></div>
    <div class="dpad-btn" onmousedown="keys.forward=true" onmouseup="keys.forward=false" ontouchstart="keys.forward=true" ontouchend="keys.forward=false">▲</div>
    <div></div>
    <div class="dpad-btn" onmousedown="keys.left=true" onmouseup="keys.left=false" ontouchstart="keys.left=true" ontouchend="keys.left=false">◀</div>
    <div class="dpad-btn" onmousedown="keys.shift=true" onmouseup="keys.shift=false" ontouchstart="keys.shift=true" ontouchend="keys.shift=false" style="font-size: 11px;">RUN</div>
    <div class="dpad-btn" onmousedown="keys.right=true" onmouseup="keys.right=false" ontouchstart="keys.right=true" ontouchend="keys.right=false">▶</div>
    <div></div>
    <div class="dpad-btn" onmousedown="keys.backward=true" onmouseup="keys.backward=false" ontouchstart="keys.backward=true" ontouchend="keys.backward=false">▼</div>
    <div></div>
  </div>

  <script>
    // --- APP STATE ---
    let currentMode = 'top'; // 'top' or 'ground'
    let isTransitioning = false;
    let transitionStart = 0;
    let transitionDuration = 1200;
    let camStartPos = new THREE.Vector3();
    let camEndPos = new THREE.Vector3();
    let camStartLook = new THREE.Vector3();
    let camEndLook = new THREE.Vector3();
    let currentLookTarget = new THREE.Vector3(0, 0, 0);

    // Three.js Core
    let scene, camera, renderer, clock, orbitControls;
    let cityModel = null;

    // Ground Walk Navigation State
    let groundPos = new THREE.Vector3(-150, 1.8, -282); // Eye level outside Walter's house
    let groundYaw = 0;   // Radians horizontal angle
    let groundPitch = 0; // Radians vertical tilt
    let groundTargetYaw = 0;
    let groundTargetPitch = 0;
    let walkSpeed = 16;  // m/s
    let sprintSpeed = 38;// m/s with Shift
    const keys = { forward: false, backward: false, left: false, right: false, shift: false };
    let isMouseDown = false;
    let lastMouseX = 0;
    let lastMouseY = 0;

    // Top View Landmark Locations (in Three.js Y-Up coordinate space)
    const LANDMARKS = [
      { id: 'walt', name: "Walt's House", x: -150, y: 0, z: -300, groundX: -150, groundZ: -282, groundYaw: 0, groundY: 1.8 },
      { id: 'pollos', name: "Los Pollos Hermanos", x: 140, y: 0, z: -40, groundX: 140, groundZ: -20, groundYaw: 0, groundY: 1.8 },
      { id: 'saul', name: "Saul Goodman", x: -60, y: 0, z: -40, groundX: -60, groundZ: -20, groundYaw: 0, groundY: 1.8 },
      { id: 'superlab', name: "Superlab Laundry", x: 90, y: 0, z: 220, groundX: 90, groundZ: 200, groundYaw: Math.PI, groundY: 1.8 },
      { id: 'carwash', name: "A1A Carwash", x: 220, y: 0, z: 40, groundX: 220, groundZ: 20, groundYaw: Math.PI, groundY: 1.8 },
      { id: 'desert', name: "To'hajiilee RV", x: -420, y: 3.5, z: -420, groundX: -416.2, groundZ: -415.8, groundYaw: 3.85, groundY: 1.8 },
      { id: 'hank', name: "Hank's House", x: 270, y: 0, z: -260, groundX: 270, groundZ: -242, groundYaw: 0, groundY: 1.8 },
      { id: 'jesse', name: "Jesse's House", x: -260, y: 0, z: -220, groundX: -260, groundZ: -205, groundYaw: 0, groundY: 1.8 },
      { id: 'downtown', name: "Route 66 Plaza", x: -250, y: 0, z: 40, groundX: -250, groundZ: 25, groundYaw: Math.PI, groundY: 1.8 }
    ];

    function init() {
      const container = document.getElementById('canvas-container');
      clock = new THREE.Clock();

      // Scene
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x8eb4d6);
      scene.fog = new THREE.FogExp2(0xccaf8a, 0.0015);

      // Camera
      camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.2, 3500);
      
      // Initial Top View Camera Setup
      camera.position.set(0, 560, 420);
      currentLookTarget.set(0, 0, 0);
      camera.lookAt(currentLookTarget);

      // WebGL Renderer
      const canvas = document.createElement('canvas');
      let glContext = canvas.getContext('webgl2') || canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
      renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        context: glContext,
        antialias: true,
        powerPreference: 'high-performance'
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;
      container.appendChild(renderer.domElement);

      // OrbitControls for Top View
      orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
      orbitControls.enableDamping = true;
      orbitControls.dampingFactor = 0.05;
      orbitControls.maxPolarAngle = Math.PI / 2 - 0.04;
      orbitControls.minDistance = 20;
      orbitControls.maxDistance = 1600;
      orbitControls.target.set(0, 0, 0);

      // Lighting
      setupLighting();

      // Create Top View Landmark Pins DOM elements
      buildLandmarkPins();

      // Load Master GLB Model
      loadModel();

      // Input Event Listeners
      window.addEventListener('resize', onWindowResize);
      window.addEventListener('keydown', onKeyDown);
      window.addEventListener('keyup', onKeyUp);
      
      // Mouse / Touch Look Controls
      container.addEventListener('mousedown', onPointerDown);
      window.addEventListener('mousemove', onPointerMove);
      window.addEventListener('mouseup', onPointerUp);

      container.addEventListener('touchstart', onTouchStart, { passive: false });
      window.addEventListener('touchmove', onTouchMove, { passive: false });
      window.addEventListener('touchend', onPointerUp);

      // Check if touch device for D-pad display
      if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
        document.getElementById('dpad').style.display = 'grid';
      }

      // Render loop
      animate();
    }

    function setupLighting() {
      // Warm Desert Sun
      const sun = new THREE.DirectionalLight(0xfff5e6, 2.6);
      sun.position.set(280, 500, 200);
      sun.castShadow = true;
      sun.shadow.mapSize.width = 2048;
      sun.shadow.mapSize.height = 2048;
      sun.shadow.camera.near = 10;
      sun.shadow.camera.far = 1200;
      const d = 320;
      sun.shadow.camera.left = -d;
      sun.shadow.camera.right = d;
      sun.shadow.camera.top = d;
      sun.shadow.camera.bottom = -d;
      scene.add(sun);

      // Hemisphere Fill
      const hemi = new THREE.HemisphereLight(0xbbe0ff, 0x82644b, 1.25);
      scene.add(hemi);

      // Ambient
      const amb = new THREE.AmbientLight(0xffffff, 0.45);
      scene.add(amb);
    }

    function loadModel() {
      const loader = new THREE.GLTFLoader();
      const statusText = document.getElementById('loader-status');
      const progressFill = document.getElementById('progress-fill');

      loader.load(
        'game_export/breaking_bad_albuquerque_master.glb',
        (gltf) => {
          cityModel = gltf.scene;

          cityModel.traverse((child) => {
            if (child.isMesh) {
              child.castShadow = true;
              child.receiveShadow = true;
            }
          });

          scene.add(cityModel);

          // Fade out loader
          const loaderElem = document.getElementById('loader');
          loaderElem.style.opacity = '0';
          setTimeout(() => loaderElem.style.display = 'none', 600);
        },
        (xhr) => {
          if (xhr.lengthComputable) {
            const pct = Math.round((xhr.loaded / xhr.total) * 100);
            statusText.innerText = `Loading Albuquerque 3D... ${pct}%`;
            progressFill.style.width = `${pct}%`;
          }
        },
        (err) => {
          console.error("Error loading city model:", err);
          statusText.innerText = "Error loading 3D city. Please refresh.";
        }
      );
    }

    // --- BUILD 3D LANDMARK PINS FOR TOP VIEW ---
    function buildLandmarkPins() {
      const container = document.getElementById('markers-container');
      LANDMARKS.forEach((lm) => {
        const pin = document.createElement('div');
        pin.className = 'landmark-pin';
        pin.id = `pin-${lm.id}`;
        pin.innerHTML = `<span class="pin-dot"></span><span>${lm.name}</span>`;
        pin.onclick = (e) => {
          e.stopPropagation();
          jumpToLandmark(lm);
        };
        container.appendChild(pin);
      });
    }

    function updateLandmarkPins() {
      if (currentMode !== 'top') {
        document.getElementById('markers-container').style.display = 'none';
        return;
      }
      document.getElementById('markers-container').style.display = 'block';

      const tempV = new THREE.Vector3();
      LANDMARKS.forEach((lm) => {
        const pin = document.getElementById(`pin-${lm.id}`);
        if (!pin) return;

        tempV.set(lm.x, lm.y + 16, lm.z); // Hover above landmark
        tempV.project(camera);

        // Behind camera check
        if (tempV.z > 1) {
          pin.style.display = 'none';
          return;
        }

        const screenX = (tempV.x * 0.5 + 0.5) * window.innerWidth;
        const screenY = (-(tempV.y * 0.5) + 0.5) * window.innerHeight;

        pin.style.display = 'flex';
        pin.style.left = `${screenX}px`;
        pin.style.top = `${screenY}px`;
      });
    }

    // --- MODE SWITCHING: ONLY TOP VIEW & GROUND EXPLORE ---
    function switchMode(newMode) {
      if (currentMode === newMode && !isTransitioning) return;

      currentMode = newMode;
      document.getElementById('btn-top').classList.toggle('active', newMode === 'top');
      document.getElementById('btn-ground').classList.toggle('active', newMode === 'ground');

      if (newMode === 'top') {
        // Switch to Top View
        document.getElementById('controls-hint').innerText = "Drag: Rotate • Right-Click: Pan • Scroll: Zoom • Click Pin: Drop to Ground";
        document.getElementById('ground-bar').style.display = 'none';
        document.getElementById('dpad').style.display = 'none';
        orbitControls.enabled = false;

        // Smooth glide to aerial perspective
        startCameraTransition(
          camera.position.clone(),
          new THREE.Vector3(0, 560, 420),
          currentLookTarget.clone(),
          new THREE.Vector3(0, 0, 0),
          1200,
          () => {
            orbitControls.enabled = true;
            orbitControls.target.set(0, 0, 0);
          }
        );

      } else {
        // Switch to Explore from Ground
        document.getElementById('controls-hint').innerText = "WASD / Arrows: Walk • Drag: Look Around • Shift: Run";
        document.getElementById('ground-bar').style.display = 'flex';
        if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
          document.getElementById('dpad').style.display = 'grid';
        }
        orbitControls.enabled = false;

        // Smooth glide down to street level
        const forwardVector = new THREE.Vector3(-Math.sin(groundYaw), 0, -Math.cos(groundYaw));
        const lookAtGround = groundPos.clone().add(forwardVector.clone().multiplyScalar(30));

        startCameraTransition(
          camera.position.clone(),
          new THREE.Vector3(groundPos.x, groundPos.y, groundPos.z),
          currentLookTarget.clone(),
          lookAtGround,
          1300,
          () => {
            camera.rotation.set(groundPitch, groundYaw, 0, 'YXZ');
          }
        );
      }
    }

    function jumpToLandmark(lm) {
      // Set ground position & rotation for this landmark
      groundPos.set(lm.groundX, lm.groundY, lm.groundZ);
      groundYaw = lm.groundYaw;
      groundPitch = 0;
      groundTargetYaw = lm.groundYaw;
      groundTargetPitch = 0;

      // Switch mode to Ground
      switchMode('ground');

      // Highlight active button in ground bar
      updateGroundBarActive(lm.id);
    }

    function teleportGround(lmId) {
      const lm = LANDMARKS.find(item => item.id === lmId);
      if (!lm) return;

      groundPos.set(lm.groundX, lm.groundY, lm.groundZ);
      groundYaw = lm.groundYaw;
      groundPitch = 0;
      groundTargetYaw = lm.groundYaw;
      groundTargetPitch = 0;

      camera.position.set(groundPos.x, groundPos.y, groundPos.z);
      camera.rotation.set(groundPitch, groundYaw, 0, 'YXZ');
      
      updateGroundBarActive(lmId);
    }

    function updateGroundBarActive(lmId) {
      const buttons = document.querySelectorAll('.ground-btn');
      buttons.forEach(b => {
        if (b.getAttribute('onclick').includes(lmId)) {
          b.classList.add('active');
        } else {
          b.classList.remove('active');
        }
      });
    }

    // --- SMOOTH CAMERA TRANSITION (EASE-IN-OUT) ---
    function startCameraTransition(fromPos, toPos, fromLook, toLook, duration, onComplete) {
      isTransitioning = true;
      transitionStart = performance.now();
      transitionDuration = duration;

      camStartPos.copy(fromPos);
      camEndPos.copy(toPos);
      camStartLook.copy(fromLook);
      camEndLook.copy(toLook);

      function stepTransition() {
        if (!isTransitioning) return;

        const now = performance.now();
        let progress = (now - transitionStart) / transitionDuration;

        if (progress >= 1) {
          progress = 1;
          isTransitioning = false;
          camera.position.copy(camEndPos);
          currentLookTarget.copy(camEndLook);
          camera.lookAt(currentLookTarget);
          if (onComplete) onComplete();
          return;
        }

        // Cubic Ease-In-Out
        const ease = progress < 0.5
          ? 4 * progress * progress * progress
          : 1 - Math.pow(-2 * progress + 2, 3) / 2;

        camera.position.lerpVectors(camStartPos, camEndPos, ease);
        currentLookTarget.lerpVectors(camStartLook, camEndLook, ease);
        camera.lookAt(currentLookTarget);

        requestAnimationFrame(stepTransition);
      }

      stepTransition();
    }

    // --- GROUND MOVEMENT PHYSICS ---
    function updateGroundWalk(delta) {
      if (currentMode !== 'ground' || isTransitioning) return;

      const currentSpeed = keys.shift ? sprintSpeed : walkSpeed;
      const moveDistance = currentSpeed * delta;

      // Forward / Back / Strafe vectors based on camera yaw
      const forward = new THREE.Vector3(-Math.sin(groundYaw), 0, -Math.cos(groundYaw));
      const right = new THREE.Vector3(Math.cos(groundYaw), 0, -Math.sin(groundYaw));

      if (keys.forward) groundPos.addScaledVector(forward, moveDistance);
      if (keys.backward) groundPos.addScaledVector(forward, -moveDistance);
      if (keys.left) groundPos.addScaledVector(right, -moveDistance);
      if (keys.right) groundPos.addScaledVector(right, moveDistance);

      // Map boundary clamping
      groundPos.x = Math.max(-580, Math.min(580, groundPos.x));
      groundPos.z = Math.max(-580, Math.min(580, groundPos.z));

      // Smooth Yaw / Pitch interpolation for mouse look
      groundYaw += (groundTargetYaw - groundYaw) * 0.25;
      groundPitch += (groundTargetPitch - groundPitch) * 0.25;

      camera.position.set(groundPos.x, groundPos.y, groundPos.z);
      camera.rotation.set(groundPitch, groundYaw, 0, 'YXZ');
    }

    // --- INPUT HANDLING ---
    function onKeyDown(e) {
      switch (e.code) {
        case 'KeyW': case 'ArrowUp': keys.forward = true; break;
        case 'KeyS': case 'ArrowDown': keys.backward = true; break;
        case 'KeyA': case 'ArrowLeft': keys.left = true; break;
        case 'KeyD': case 'ArrowRight': keys.right = true; break;
        case 'ShiftLeft': case 'ShiftRight': keys.shift = true; break;
        case 'Digit1': switchMode('top'); break;
        case 'Digit2': switchMode('ground'); break;
      }
    }

    function onKeyUp(e) {
      switch (e.code) {
        case 'KeyW': case 'ArrowUp': keys.forward = false; break;
        case 'KeyS': case 'ArrowDown': keys.backward = false; break;
        case 'KeyA': case 'ArrowLeft': keys.left = false; break;
        case 'KeyD': case 'ArrowRight': keys.right = false; break;
        case 'ShiftLeft': case 'ShiftRight': keys.shift = false; break;
      }
    }

    function onPointerDown(e) {
      if (currentMode !== 'ground') return;
      isMouseDown = true;
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;
    }

    function onPointerMove(e) {
      if (currentMode !== 'ground' || !isMouseDown || isTransitioning) return;

      const deltaX = e.clientX - lastMouseX;
      const deltaY = e.clientY - lastMouseY;
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;

      const sensitivity = 0.0035;
      groundTargetYaw -= deltaX * sensitivity;
      groundTargetPitch -= deltaY * sensitivity;

      // Clamp vertical pitch to avoid flipping (-80 deg to +80 deg)
      groundTargetPitch = Math.max(-1.4, Math.min(1.4, groundTargetPitch));
    }

    function onPointerUp() {
      isMouseDown = false;
    }

    function onTouchStart(e) {
      if (currentMode !== 'ground' || e.touches.length !== 1) return;
      isMouseDown = true;
      lastMouseX = e.touches[0].clientX;
      lastMouseY = e.touches[0].clientY;
    }

    function onTouchMove(e) {
      if (currentMode !== 'ground' || !isMouseDown || e.touches.length !== 1) return;
      const deltaX = e.touches[0].clientX - lastMouseX;
      const deltaY = e.touches[0].clientY - lastMouseY;
      lastMouseX = e.touches[0].clientX;
      lastMouseY = e.touches[0].clientY;

      const sensitivity = 0.004;
      groundTargetYaw -= deltaX * sensitivity;
      groundTargetPitch -= deltaY * sensitivity;
      groundTargetPitch = Math.max(-1.4, Math.min(1.4, groundTargetPitch));
      e.preventDefault();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // --- MAIN RENDER LOOP ---
    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();

      if (currentMode === 'top') {
        if (!isTransitioning) {
          orbitControls.update();
        }
        updateLandmarkPins();
      } else if (currentMode === 'ground') {
        updateGroundWalk(delta);
      }

      renderer.render(scene, camera);
    }

    // Initialize application on load
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
